[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agentforge-sdk"
version = "0.2.0"
description = "Typed Python client for AgentForge runs, evidence, approvals and events"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]
[tool.setuptools.packages.find]
where = ["."]
